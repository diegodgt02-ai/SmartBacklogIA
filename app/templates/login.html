{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block anon %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="brand" style="padding:0 0 18px">
      <span class="brand-mark">SPB</span>
      <div>
        <div style="font-size:16px">Smart Product Backlog</div>
        <div class="small muted">Gestión de HU asistida por IA</div>
      </div>
    </div>
    <h1 style="margin-bottom:6px">Ingresar</h1>
    <p class="muted" style="margin-bottom:18px">Usa tu correo y contraseña asignados por el administrador.</p>

    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}

    <form method="post" action="/login">
      <div class="field">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px" type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
